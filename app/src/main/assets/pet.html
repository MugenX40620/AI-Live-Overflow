<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>pet</title>
<style>
  :root { --base-w: 160px; --base-h: 205px; }

  html, body {
    margin: 0; padding: 0;
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body.preview { background: radial-gradient(circle at 50% 32%, #f6f0e7, #e4dacb); }

  #stage { position: relative; width: 100%; height: 100%; }

  /* ============ 桌宠 ============ */
  #pet {
    position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: var(--base-w); height: auto;
    transition: width .25s ease;
  }

  /* 呼吸 */
  .breathe {
    animation: breathe 3.4s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 100%;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-2px) scale(1.012); }
  }
  body[data-state="sleep"] .breathe { animation: breatheSleep 5.2s ease-in-out infinite; }
  @keyframes breatheSleep {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-1px) scale(1.02); }
  }

  /* 耳朵抖 */
  .ear { transform-box: view-box; }
  .earL { transform-origin: 84px 54px; animation: earTwitch 5.0s ease-in-out infinite; }
  .earR { transform-origin: 116px 54px; animation: earTwitch 5.7s ease-in-out infinite 1.2s; }
  @keyframes earTwitch {
    0%, 86%, 100% { transform: rotate(0deg); }
    88% { transform: rotate(-11deg); }
    90% { transform: rotate(5deg); }
    92% { transform: rotate(-7deg); }
    94% { transform: rotate(3deg); }
    96% { transform: rotate(0deg); }
  }

  /* 尾巴摇 */
  .tail {
    transform-box: view-box; transform-origin: 116px 146px;
    animation: tailWag 2.1s ease-in-out infinite;
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(-8deg); }
    70% { transform: rotate(8deg); }
  }
  body[data-state="sleep"] .tail { animation: tailWagSlow 4.6s ease-in-out infinite; }
  @keyframes tailWagSlow {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-4deg); }
  }

  /* 吃饭时头部上下 */
  #eatHeadInner { transform-box: view-box; transform-origin: 100px 128px; animation: headBob .9s ease-in-out infinite; }
  @keyframes headBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    45%      { transform: translateY(3px) rotate(2deg); }
    70%      { transform: translateY(1px) rotate(-1deg); }
  }

  /* ============ 眼珠子 ============ */
  .orbPos { transition: transform 1.1s cubic-bezier(.4, 0, .2, 1); }
  .orbPos.p1 { transform: translate(30px, 46px); }
  .orbPos.p2 { transform: translate(171px, 48px); }
  .orbPos.p3 { transform: translate(29px, 146px); }

  body[data-state="sleep"] .orbPos.p1 { transform: translate(38px, 112px); }
  body[data-state="sleep"] .orbPos.p2 { transform: translate(164px, 116px); }
  body[data-state="sleep"] .orbPos.p3 { transform: translate(26px, 146px); }

  body[data-state="eat"] .orbPos.p1 { transform: translate(60px, 158px); }
  body[data-state="eat"] .orbPos.p2 { transform: translate(142px, 158px); }
  body[data-state="eat"] .orbPos.p3 { transform: translate(172px, 118px); }

  body[data-state="hungry"] .orbPos.p1 { transform: translate(44px, 34px); }
  body[data-state="hungry"] .orbPos.p2 { transform: translate(158px, 36px); }
  body[data-state="hungry"] .orbPos.p3 { transform: translate(34px, 132px); }

  .orb { transform-box: fill-box; transform-origin: center; }
  .orb1 { animation: orbFloat1 3.6s ease-in-out infinite; }
  .orb2 { animation: orbFloat2 4.4s ease-in-out infinite .6s; }
  .orb3 { animation: orbFloat3 4.0s ease-in-out infinite 1.3s; }
  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50%     { transform: translate(4px,-6px) rotate(11deg); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50%     { transform: translate(-5px,-7px) rotate(-13deg); }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50%     { transform: translate(3px,5px) rotate(9deg); }
  }
  body[data-state="sleep"] .orb1 { animation-duration: 8.5s; }
  body[data-state="sleep"] .orb2 { animation-duration: 9.5s; }
  body[data-state="sleep"] .orb3 { animation-duration: 9.0s; }
  body[data-state="eat"] .orb1,
  body[data-state="eat"] .orb2,
  body[data-state="eat"] .orb3 { animation-duration: 5.5s; }

  .pupilGrp { transform-box: fill-box; transform-origin: center; }
  .orb1 .pupilGrp { animation: pupilDrift 2.8s ease-in-out infinite; }
  .orb2 .pupilGrp { animation: pupilDrift 3.4s ease-in-out infinite 1s; }
  .orb3 .pupilGrp { animation: pupilDrift 3.1s ease-in-out infinite .4s; }
  @keyframes pupilDrift {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(1px,-.6px); }
    75% { transform: translate(-1.2px,.6px); }
  }

  .sclera, .pupil, .glint, .mouth, .eyeSmile, .eyeClosed { transition: opacity .16s ease; }

  /* ============ 姿态切换 ============ */
  #gSleep, #gEat { display: none; }
  body[data-state="sleep"] #gIdle { display: none; }
  body[data-state="sleep"] #gSleep { display: inline; }
  body[data-state="eat"] #gIdle { display: none; }
  body[data-state="eat"] #gEat { display: inline; }

  /* Zzz */
  #zzz { opacity: 0; transition: opacity .4s ease; }
  body[data-state="sleep"] #zzz { opacity: 1; }
  .zz { animation: zFloat 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .zz2 { animation-delay: .7s; }
  .zz3 { animation-delay: 1.4s; }
  @keyframes zFloat {
    0%   { opacity: 0; transform: translate(0,0) scale(.85); }
    30%  { opacity: .85; }
    70%  { opacity: .55; }
    100% { opacity: 0; transform: translate(6px,-14px) scale(1.05); }
  }

  /* ============ 气泡 ============ */
  #bubble {
    position: absolute; left: 50%;
    bottom: calc(var(--base-w) * 0.8 - 6px);
    transform: translateX(-50%) translateY(6px);
    box-sizing: border-box;
    background: #ffffff; color: #5d4632;
    border: 2px solid #ecdbc7; border-radius: 14px;
    padding: 6px 10px; font-size: 12px; line-height: 1.36;
    max-width: 148px; text-align: center;
    opacity: 0; transition: opacity .18s ease, transform .18s ease;
    pointer-events: none; box-shadow: 0 3px 10px rgba(0,0,0,.22);
    z-index: 20; word-break: break-word; white-space: normal;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #bubble.clickable { pointer-events: auto; background: #fffdf6; border-color: #f0c87c; }
  #bubble::after {
    content: ''; position: absolute; bottom: -7px; left: 50%;
    transform: translateX(-50%);
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-top: 7px solid #ffffff;
  }
  #bubble.clickable::after { border-top-color: #fffdf6; }

  /* ============ 菜单 ============ */
  .panel {
    position: absolute; top: 4px; left: 50%;
    width: 156px; padding: 6px;
    background: rgba(26,24,31,.97);
    border: 1px solid #3a3444; border-radius: 14px;
    opacity: 0; pointer-events: none;
    transform: translateX(-50%) scale(.94);
    transition: opacity .16s ease, transform .16s ease;
    z-index: 30; box-shadow: 0 8px 22px rgba(0,0,0,.42);
  }
  .panel.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }

  .ptitle { color: #8d8499; font-size: 10px; padding: 3px 8px 5px; letter-spacing: .5px; }
  .mi {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 9px; border-radius: 9px; color: #efe8e0; font-size: 12.5px;
  }
  .mi:active { background: #37313f; }
  .mi .sub { color: #968da3; font-size: 10px; margin-left: 8px; }
  .mi .ico { margin-right: 7px; font-size: 13px; }

  /* 眼睛叠加状态 */
  #eyeSmileL, #eyeSmileR, #eyeClosedL, #eyeClosedR { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>

  <div class="panel" id="menu"></div>
  <div class="panel" id="foods"></div>

  <svg id="pet" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="orbGrad" cx="40%" cy="34%" r="66%">
        <stop offset="0%" stop-color="#6a2f42"/>
        <stop offset="58%" stop-color="#3d1726"/>
        <stop offset="100%" stop-color="#18070f"/>
      </radialGradient>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.36"/>
        <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- ================= 清醒/坐姿 ================= -->
    <g id="gIdle">
      <g class="breathe">
        <!-- 卷尾 -->
        <path class="tail" d="M116 146 C 142 142, 158 154, 156 168 C 154 181, 139 184, 132 175"
              fill="none" stroke="#1e1e26" stroke-width="13" stroke-linecap="round"/>

        <!-- 耳朵 -->
        <g class="ear earL">
          <path d="M72 58 C 69 47, 67 36, 68 27 C 68.5 23, 72.5 23, 74 27 C 80 35, 88 44, 95 50 Z" fill="#1e1e26"/>
          <path d="M75 49 C 73 41, 72 33, 73 28 C 73.5 25.5, 76 25.5, 77.5 28 C 81.5 35, 86 42, 91 46 Z" fill="#3a2442" opacity=".9"/>
        </g>
        <g class="ear earR">
          <path d="M128 58 C 131 47, 133 36, 132 27 C 131.5 23, 127.5 23, 126 27 C 120 35, 112 44, 105 50 Z" fill="#1e1e26"/>
          <path d="M125 49 C 127 41, 128 33, 127 28 C 126.5 25.5, 124 25.5, 122.5 28 C 118.5 35, 114 42, 109 46 Z" fill="#3a2442" opacity=".9"/>
        </g>

        <!-- 身体 -->
        <path d="M100 90
                 C 113 90, 121 100, 122 117
                 C 123 138, 129 152, 128 162
                 C 127 172, 115 176, 100 176
                 C 85 176, 73 172, 72 162
                 C 71 152, 77 138, 78 117
                 C 79 100, 87 90, 100 90 Z" fill="#1e1e26"/>

        <!-- 头 -->
        <path d="M100 40
                 C 118 40, 131 52, 131 70
                 C 131 86, 121 96, 107 99
                 C 103 100, 97 100, 93 99
                 C 79 96, 69 86, 69 70
                 C 69 52, 82 40, 100 40 Z" fill="#1e1e26"/>

        <!-- 眼睛 -->
        <g id="eyeL" transform="translate(84,74)">
          <ellipse class="sclera" rx="8.5" ry="11" fill="#f7f0e4"/>
          <ellipse class="pupil" cx="0" cy="1" rx="4" ry="5.5" fill="#d08c2e"/>
          <circle class="glint" cx="-2.5" cy="-3.5" r="2.2" fill="#ffffff"/>
          <path id="eyeSmileL" class="eyeSmile" d="M-7 .5 Q0 -6 7 .5" fill="none" stroke="#f7f0e4" stroke-width="3" stroke-linecap="round"/>
          <path id="eyeClosedL" class="eyeClosed" d="M-7 0 Q0 4.5 7 0" fill="none" stroke="#f7f0e4" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g id="eyeR" transform="translate(116,74)">
          <ellipse class="sclera" rx="8.5" ry="11" fill="#f7f0e4"/>
          <ellipse class="pupil" cx="0" cy="1" rx="4" ry="5.5" fill="#d08c2e"/>
          <circle class="glint" cx="-2.5" cy="-3.5" r="2.2" fill="#ffffff"/>
          <path id="eyeSmileR" class="eyeSmile" d="M-7 .5 Q0 -6 7 .5" fill="none" stroke="#f7f0e4" stroke-width="3" stroke-linecap="round"/>
          <path id="eyeClosedR" class="eyeClosed" d="M-7 0 Q0 4.5 7 0" fill="none" stroke="#f7f0e4" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 嘴 -->
        <path class="mouth" id="mouthCat" d="M90 90 Q95 94.5 100 90 Q105 94.5 110 90"
              fill="none" stroke="#e0a14f" stroke-width="1.8" stroke-linecap="round"/>
        <g class="mouth" id="mouthOpen" opacity="0">
          <path d="M94.5 89.5 Q100 96.5 105.5 89.5 Z" fill="#200608" stroke="#e0a14f" stroke-width="1.1"/>
          <path d="M97.5 92 Q100 95 102.5 92 Z" fill="#c0505a"/>
        </g>

        <!-- 前爪 -->
        <ellipse cx="91" cy="164" rx="10" ry="8" fill="#14141b"/>
        <ellipse cx="109" cy="164" rx="10" ry="8" fill="#14141b"/>
      </g>
    </g>

    <!-- ================= 睡觉（猫猫饼） ================= -->
    <g id="gSleep">
      <g class="breathe">
        <!-- 摊平的身体 -->
        <path d="M44 164 C 44 142, 66 130, 100 130 C 134 130, 156 142, 156 164
                 C 156 178, 134 184, 100 184 C 66 184, 44 178, 44 164 Z" fill="#1e1e26"/>
        <!-- 卷在右侧的尾巴 -->
        <path class="tail" d="M150 170 C 168 172, 168 184, 146 185"
              fill="none" stroke="#1e1e26" stroke-width="12" stroke-linecap="round"/>
        <!-- 前爪收在脸下 -->
        <ellipse cx="88" cy="178" rx="12" ry="6" fill="#14141b"/>
        <ellipse cx="70" cy="177" rx="10" ry="5.5" fill="#14141b"/>
        <!-- 脑袋枕在左边 -->
        <path d="M68 132
                 C 82 132, 92 141, 92 154
                 C 92 168, 83 177, 68 177
                 C 53 177, 44 168, 44 154
                 C 44 141, 54 132, 68 132 Z" fill="#1e1e26"/>
        <!-- 塌下来的耳朵 -->
        <path d="M50 140 C 44 132, 41 125, 44 123 C 47 121, 53 126, 57 132 Z" fill="#1e1e26"/>
        <path d="M86 140 C 92 132, 95 125, 92 123 C 89 121, 83 126, 79 132 Z" fill="#1e1e26"/>
        <!-- 闭眼 -->
        <path d="M56 155 Q61 160.5 66 155" fill="none" stroke="#f7f0e4" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M71.5 155 Q76.5 160.5 81.5 155" fill="none" stroke="#f7f0e4" stroke-width="2.6" stroke-linecap="round"/>
        <!-- 鼻子+嘴 -->
        <path d="M66 166 Q68 169 70 166" fill="none" stroke="#e0a14f" stroke-width="1.5" stroke-linecap="round"/>
        <!-- 胡须 -->
        <path d="M56 168 L44 166 M56 171 L45 173" stroke="#2b2b35" stroke-width="1" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ================= 吃饭 ================= -->
    <g id="gEat">
      <g class="breathe">
        <!-- 尾巴 -->
        <path class="tail" d="M116 146 C 142 142, 158 154, 156 168 C 154 181, 139 184, 132 175"
              fill="none" stroke="#1e1e26" stroke-width="13" stroke-linecap="round"/>
        <!-- 身体（无头） -->
        <path d="M100 92
                 C 113 92, 121 102, 122 118
                 C 123 138, 129 152, 128 162
                 C 127 172, 115 176, 100 176
                 C 85 176, 73 172, 72 162
                 C 71 152, 77 138, 78 118
                 C 79 102, 87 92, 100 92 Z" fill="#1e1e26"/>
        <!-- 碗 -->
        <ellipse cx="100" cy="171" rx="25" ry="7" fill="#33272a"/>
        <path d="M75 171 C 76 186, 84 193, 100 193 C 116 193, 124 186, 125 171 Z" fill="#574238"/>
        <ellipse cx="100" cy="171" rx="25" ry="7" fill="none" stroke="#7d6355" stroke-width="2"/>
        <circle cx="92" cy="169" r="5.4" fill="#c9a06a"/>
        <circle cx="103" cy="170" r="5" fill="#bd9059"/>
        <circle cx="110" cy="168" r="4.2" fill="#d3ab74"/>
        <!-- 低下去的头（外层定位，内层做动画） -->
        <g transform="translate(0,58)">
          <g id="eatHeadInner">
            <!-- 耳朵（略微后压） -->
            <path d="M72 58 C 69 47, 67 36, 68 27 C 68.5 23, 72.5 23, 74 27 C 80 35, 88 44, 95 50 Z" fill="#1e1e26"/>
            <path d="M128 58 C 131 47, 133 36, 132 27 C 131.5 23, 127.5 23, 126 27 C 120 35, 112 44, 105 50 Z" fill="#1e1e26"/>
            <!-- 头 -->
            <path d="M100 40
                     C 118 40, 131 52, 131 70
                     C 131 86, 121 96, 107 99
                     C 103 100, 97 100, 93 99
                     C 79 96, 69 86, 69 70
                     C 69 52, 82 40, 100 40 Z" fill="#1e1e26"/>
            <!-- 半闭眼 -->
            <path d="M77 76 Q84 80 91 76" fill="none" stroke="#f7f0e4" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M109 76 Q116 80 123 76" fill="none" stroke="#f7f0e4" stroke-width="2.6" stroke-linecap="round"/>
            <!-- 埋进碗里的嘴 -->
            <path d="M93 93 Q100 98 107 93" fill="none" stroke="#e0a14f" stroke-width="1.8" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= Zzz ================= -->
    <g id="zzz">
      <text class="zz" x="124" y="120" font-size="13" fill="#8e7ba6" font-family="sans-serif">z</text>
      <text class="zz zz2" x="136" y="104" font-size="17" fill="#8e7ba6" font-family="sans-serif">z</text>
      <text class="zz zz3" x="150" y="86" font-size="21" fill="#8e7ba6" font-family="sans-serif">Z</text>
    </g>

    <!-- ================= 飘着的眼珠子 ================= -->
    <g class="orbPos p1">
      <g class="orb orb1">
        <circle cx="0" cy="0" r="20" fill="url(#glowGrad)"/>
        <circle cx="0" cy="0" r="10" fill="url(#orbGrad)"/>
        <g class="pupilGrp">
          <circle cx="0" cy="0" r="4.2" fill="#0a0a0e"/>
          <circle cx="-1.4" cy="-1.4" r="1.7" fill="#ff9aa8" opacity=".9"/>
        </g>
      </g>
    </g>
    <g class="orbPos p2">
      <g class="orb orb2">
        <circle cx="0" cy="0" r="18" fill="url(#glowGrad)"/>
        <circle cx="0" cy="0" r="9" fill="url(#orbGrad)"/>
        <g class="pupilGrp">
          <circle cx="0" cy="0" r="3.8" fill="#0a0a0e"/>
          <circle cx="-1.3" cy="-1.3" r="1.5" fill="#ff9aa8" opacity=".9"/>
        </g>
      </g>
    </g>
    <g class="orbPos p3">
      <g class="orb orb3">
        <circle cx="0" cy="0" r="17" fill="url(#glowGrad)"/>
        <circle cx="0" cy="0" r="8.5" fill="url(#orbGrad)"/>
        <g class="pupilGrp">
          <circle cx="0" cy="0" r="3.6" fill="#0a0a0e"/>
          <circle cx="-1.2" cy="-1.2" r="1.4" fill="#ff9aa8" opacity=".9"/>
        </g>
      </g>
    </g>
  </svg>
</div>

<script>
(function () {
  'use strict';

  var bubble  = document.getElementById('bubble');
  var stage   = document.getElementById('stage');
  var menuEl  = document.getElementById('menu');
  var foodEl  = document.getElementById('foods');
  var eyeL    = document.getElementById('eyeL');
  var eyeR    = document.getElementById('eyeR');
  var mouthCat  = document.getElementById('mouthCat');
  var mouthOpen = document.getElementById('mouthOpen');
  var bridge  = window.PetBridge || null;

  var S = { state: 'idle', hunger: 20, rate: 2, size: 0 };

  /* ---------------- 基础工具 ---------------- */

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function phaseOf(h) {
    if (h < 5)  return 'night';
    if (h < 9)  return 'morning';
    if (h < 12) return 'forenoon';
    if (h < 14) return 'noon';
    if (h < 18) return 'afternoon';
    if (h < 22) return 'evening';
    return 'night';
  }
  function phase() { return phaseOf(new Date().getHours()); }

  function setSize(dp) {
    if (!dp || dp === S.size) return;
    S.size = dp;
    document.documentElement.style.setProperty('--base-w', dp + 'px');
    document.documentElement.style.setProperty('--base-h', Math.round(dp * 1.28) + 'px');
  }

  /* ---------------- 气泡 ---------------- */

  var sayTimer = null;

  function hideBubble() {
    bubble.classList.remove('show', 'clickable');
    bubble.onclick = null;
    clearTimeout(sayTimer);
  }

  function say(text, opts) {
    opts = opts || {};
    bubble.textContent = text;
    bubble.classList.toggle('clickable', !!opts.action);
    bubble.onclick = opts.action
      ? function (e) { e.stopPropagation(); hideBubble(); if (opts.action === 'food') openFoods(); }
      : null;
    bubble.classList.add('show');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(hideBubble, opts.ms || 2600);
  }

  /* ---------------- 语气库 ---------------- */

  var L = {
    tap: [
      '嗯？我在。', '戳我干嘛。', '怎么啦。', '在听，说吧。',
      '手别乱戳。', '……又想我了？', '嗯，看着你呢。', '要说什么，我等着。',
      '轻点，戳疼了。', '我在。不用叫第二遍。'
    ],
    tapHungry: [
      '先喂我，再摸。', '饿着肚子不给戳。', '……你听见我肚子叫了吗。'
    ],
    dbl: [
      '抱一下。', '看到你了。', '今天也守着你。', '别松手。',
      '嘿嘿。', '这一下，算你有点良心。', '嗯，回来就好。'
    ],
    long: [
      '……再摸一会儿。', '耳朵别碰。', '别停。', '这样就好，别动。',
      '你手很暖。', '嗯。就一会儿。', '……我记得这个力道。'
    ],
    idle: {
      morning: [
        '醒了？先喝口水。', '早。今天别空着肚子出门。', '早安，今天也归我管。',
        '睡够了吗。', '窗外有太阳，去晒一会儿。'
      ],
      forenoon: [
        '在忙什么。', '坐直一点。', '别一直盯着屏幕。', '我在这儿，不吵你。',
        '渴了就喝水，别等想起来。'
      ],
      noon: [
        '吃饭了吗。', '到点了，去吃。', '别拿零食当饭。', '中午歇一会儿。',
        '吃完再忙。'
      ],
      afternoon: [
        '下午容易困，站起来走两步。', '眼睛疼就闭上歇十秒。', '别硬撑。',
        '要不要摸摸我。', '我一直在。'
      ],
      evening: [
        '今天辛苦了。', '天黑得早了，早点回去。', '晚饭别拖。',
        '今天有好好吃饭吗。', '累了就靠一会儿。'
      ],
      night: [
        '这么晚还不睡。', '该睡了。', '别再刷了，眼睛会疼。',
        '我在，睡吧。', '灯暗一点，好入睡。', '明天再说，今天到此为止。'
      ]
    },
    idleSleep: ['……嗯。', '（翻了个身）', '……别吵。', 'Zzz'],
    hungry: [
      '有点饿了。', '肚子在叫。', '喂我一口吧。', '……可以吃饭了吗。',
      '饿。', '闻到味道了。'
    ],
    hungryBad: [
      '真的很饿了。', '再不吃，我要生气了。', '……喂我。现在。', '你忍心？'
    ],
    ate: ['谢谢。', '……好吃。', '还要。', '嗯，够了。', '你手艺不错。'],
    sleepOn: ['……那我睡了。', '晚安。', '守着你睡。'],
    wake: ['……醒了。', '嗯，我起来了。', '叫我？'],
    rare: [
      '我以前，问过海鸟有没有见过你。',
      '不管你忘多少次，我都认得。',
      '别怕，我睡得很浅。',
      '有些话我不说，但都记着。',
      '你要记住，永远有人守着你。'
    ]
  };

  /* ---------------- 表情 ---------------- */

  var exp = 'normal';
  var expTimer = null;

  function setEyes(mode) {
    var cls = mode === 'happy' ? 'happy' : (mode === 'shy' ? 'shy' : 'normal');
    var showSclera = cls === 'normal' || cls === 'shy';
    var ry = cls === 'shy' ? 6 : 11;
    [eyeL, eyeR].forEach(function (e) {
      e.querySelector('.sclera').setAttribute('ry', ry);
      e.querySelector('.sclera').setAttribute('opacity', showSclera ? 1 : 0);
      e.querySelector('.pupil').setAttribute('opacity', showSclera ? 1 : 0);
      e.querySelector('.glint').setAttribute('opacity', showSclera ? 1 : 0);
      e.querySelector('.eyeSmile').setAttribute('opacity', cls === 'happy' ? 1 : 0);
      e.querySelector('.eyeClosed').setAttribute('opacity', 0);
    });
  }

  function setExpression(mode) {
    exp = mode;
    setEyes(mode);
    mouthCat.setAttribute('opacity', mode === 'happy' ? 0 : 1);
    mouthOpen.setAttribute('opacity', mode === 'happy' ? 1 : 0);
  }

  function blink() {
    if (exp !== 'normal' || S.state === 'sleep' || S.state === 'eat') return;
    [eyeL, eyeR].forEach(function (e) {
      e.querySelector('.sclera').setAttribute('ry', 1.2);
      e.querySelector('.pupil').setAttribute('opacity', 0);
      e.querySelector('.glint').setAttribute('opacity', 0);
    });
    setTimeout(function () { if (exp === 'normal') setEyes('normal'); }, 130);
  }

  /* ---------------- 状态 ---------------- */

  function applyState(o) {
    if (!o) return;
    var prev = S.state;
    if (o.state) S.state = o.state;
    if (typeof o.hunger === 'number') S.hunger = o.hunger;
    if (typeof o.rate === 'number' && o.rate !== S.rate) { S.rate = o.rate; scheduleChat(); }
    if (o.size) setSize(o.size);

    document.body.dataset.state = S.state;

    if (S.state !== prev) {
      if (S.state === 'eat' && prev !== 'eat') {
        hideBubble();
      } else if (prev === 'eat') {
        setExpression('happy');
        clearTimeout(expTimer);
        expTimer = setTimeout(function () { setExpression('normal'); }, 2800);
        say(pick(L.ate));
      } else {
        hideBubble();
        if (S.state === 'idle' || S.state === 'hungry') setExpression('normal');
      }
    }
  }

  /* ---------------- 手势 ---------------- */

  var press = null;
  var lastTap = 0, tapTimer = null;

  function react(kind) {
    if (S.state === 'sleep') { say('……嗯。', { ms: 1600 }); return; }

    if (kind === 'double') { setExpression('happy'); say(pick(L.dbl)); }
    else if (kind === 'long') { setExpression('shy'); say(pick(L.long), { ms: 3000 }); }
    else {
      setExpression('normal');
      var pool = (S.hunger >= 70 && Math.random() < 0.55) ? L.tapHungry : L.tap;
      say(pick(pool));
    }

    clearTimeout(expTimer);
    expTimer = setTimeout(function () { setExpression('normal'); }, 2800);

    if (bridge) try { bridge.event(kind); } catch (e) {}
  }

  function handleTap() {
    var now = Date.now();
    if (now - lastTap < 300) {
      clearTimeout(tapTimer);
      lastTap = 0;
      react('double');
    } else {
      lastTap = now;
      tapTimer = setTimeout(function () { react('tap'); }, 280);
    }
  }

  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.panel, #bubble')) return;
    press = {
      x: e.clientX, y: e.clientY,
      lx: e.clientX, ly: e.clientY,
      t: Date.now(), moved: false, long: false, timer: null
    };
    press.timer = setTimeout(function () {
      if (press && !press.moved) { press.long = true; openMenu(); }
    }, 520);
  }, { passive: true });

  stage.addEventListener('pointermove', function (e) {
    if (!press) return;
    var dx = e.clientX - press.lx;
    var dy = e.clientY - press.ly;
    if (Math.abs(e.clientX - press.x) > 5 || Math.abs(e.clientY - press.y) > 5) {
      press.moved = true;
      clearTimeout(press.timer);
    }
    if (press.moved && (dx || dy)) {
      if (bridge) { try { bridge.drag(Math.round(dx), Math.round(dy)); } catch (err) {} }
      press.lx = e.clientX;
      press.ly = e.clientY;
    }
  }, { passive: true });

  stage.addEventListener('pointerup', function (e) {
    if (!press) return;
    clearTimeout(press.timer);
    var wasLong = press.long, moved = press.moved;
    press = null;
    if (!wasLong && !moved) handleTap();
  }, { passive: true });

  stage.addEventListener('pointercancel', function () {
    if (press) clearTimeout(press.timer);
    press = null;
  }, { passive: true });

  /* ---------------- 菜单 ---------------- */

  function closePanels() {
    menuEl.classList.remove('show');
    foodEl.classList.remove('show');
    if (bridge) { try { bridge.resize(0, 0); } catch (e) {} }
  }

  function openMenu() {
    if (S.state === 'eat') { say('吃着呢。', { ms: 1500 }); return; }

    var sleeping = (S.state === 'sleep');
    var items = [];

    items.push({ act: 'feed',  ico: '🍚', label: '喂它吃点', sub: '' });
    items.push({ act: sleeping ? 'wake' : 'sleep', ico: sleeping ? '☀' : '🌙',
                 label: sleeping ? '叫醒它' : '让它睡', sub: '' });
    items.push({ act: 'pat',   ico: '✋', label: '摸摸头', sub: '' });
    items.push({ act: 'settings', ico: '⚙', label: '设置', sub: '' });

    menuEl.innerHTML = '<div class="ptitle">要做什么</div>' + items.map(function (it) {
      return '<div class="mi" data-act="' + it.act + '"><span><span class="ico">' + it.ico + '</span>' +
             it.label + '</span><span class="sub">' + it.sub + '</span></div>';
    }).join('');

    Array.prototype.forEach.call(menuEl.querySelectorAll('.mi'), function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var act = el.getAttribute('data-act');
        if (act === 'feed') { closePanels(); openFoods(); return; }
        closePanels();
        if (act === 'pat') { react('long'); return; }
        if (act === 'sleep') { say(pick(L.sleepOn), { ms: 1800 }); }
        if (act === 'wake')  { say(pick(L.wake), { ms: 1800 }); }
        if (bridge) { try { bridge.event(act); } catch (err) {} }
      });
    });

    hideBubble();
    menuEl.classList.add('show');
    if (bridge) { try { bridge.resize(170, 320); } catch (e) {} }
  }

  var FOODS = [
    { id: 'rice', ico: '🍙', name: '饭团',  sub: '-38' },
    { id: 'fish', ico: '🐟', name: '小鱼干', sub: '-26' },
    { id: 'soup', ico: '🥣', name: '热汤',  sub: '-16' }
  ];

  function openFoods() {
    foodEl.innerHTML = '<div class="ptitle">吃什么</div>' + FOODS.map(function (f) {
      return '<div class="mi" data-id="' + f.id + '"><span><span class="ico">' + f.ico + '</span>' +
             f.name + '</span><span class="sub">' + f.sub + '</span></div>';
    }).join('');

    Array.prototype.forEach.call(foodEl.querySelectorAll('.mi'), function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = el.getAttribute('data-id');
        closePanels();
        feed(id);
      });
    });

    hideBubble();
    foodEl.classList.add('show');
    if (bridge) { try { bridge.resize(170, 320); } catch (er) {} }
  }

  function feed(id) {
    if (bridge) {
      try { bridge.feed(id); } catch (e) {}
      return;
    }
    // 预览模式：本地模拟
    var dec = id === 'rice' ? 38 : (id === 'fish' ? 26 : 16);
    S.hunger = Math.max(0, S.hunger - dec);
    applyState({ state: 'eat', hunger: S.hunger });
    setTimeout(function () {
      applyState({ state: S.hunger >= 70 ? 'hungry' : 'idle', hunger: S.hunger });
      say(pick(L.ate));
    }, 5200);
  }

  /* ---------------- 闲聊节奏 ---------------- */

  var chatTimer = null;
  var recent = [];

  function rememberLine(t) {
    recent.push(t);
    if (recent.length > 12) recent.shift();
  }
  function fresh(t) { return recent.indexOf(t) < 0; }

  function pickLine(pool) {
    var avail = pool.filter(fresh);
    var t = pick(avail.length ? avail : pool);
    rememberLine(t);
    return t;
  }

  function scheduleChat() {
    clearTimeout(chatTimer);
    if (!S.rate) return;
    var rg = S.rate === 1 ? [12, 20] : (S.rate === 3 ? [3, 6] : [6, 11]);
    var mins = rg[0] + Math.random() * (rg[1] - rg[0]);
    chatTimer = setTimeout(function () { chatOnce(); scheduleChat(); }, mins * 60000);
  }

  function chatOnce() {
    if (menuEl.classList.contains('show') || foodEl.classList.contains('show')) return;
    if (bubble.classList.contains('show')) return;

    if (S.state === 'sleep') {
      if (Math.random() < 0.25) say(pick(L.idleSleep), { ms: 1500 });
      return;
    }
    if (S.state === 'eat') return;

    if (Math.random() < 0.04) { say(pick(L.rare), { ms: 4200 }); return; }

    var pool = (L.idle[phase()] || L.idle.forenoon).slice();
    if (S.hunger >= 70) pool = pool.concat(L.hungry);
    say(pickLine(pool), { ms: 3400 });
  }

  /* 饿了主动提示（气泡可点，点开就是菜单） */
  var lastHungryAt = 0;

  setInterval(function () {
    if (S.state === 'eat' || S.state === 'sleep') return;
    if (menuEl.classList.contains('show') || foodEl.classList.contains('show')) return;
    if (S.hunger < 70) return;
    if (Date.now() - lastHungryAt < 11 * 60000) return;
    if (bubble.classList.contains('show')) return;

    lastHungryAt = Date.now();
    var bad = S.hunger >= 90;
    say(pick(bad ? L.hungryBad : L.hungry), { ms: 8000, action: 'food' });
  }, 60000);

  /* ---------------- 初始化 ---------------- */

  var qs = location.search || '';
  if (qs.indexOf('bg=1') >= 0) document.body.classList.add('preview');

  if (bridge && bridge.getState) {
    try {
      var st = JSON.parse(bridge.getState() || '{}');
      applyState(st);
    } catch (e) { applyState({ state: 'idle', hunger: 20, rate: 2 }); }
  } else {
    var demoState = (qs.match(/state=(\w+)/) || [])[1] || 'idle';
    var demoHunger = demoState === 'hungry' ? 82 : 30;
    applyState({ state: demoState, hunger: demoHunger, rate: 2, size: 160 });
  }

  setInterval(function () { if (Math.random() < 0.5) blink(); }, 3200);
  scheduleChat();

  if (qs.indexOf('menu=1') >= 0) setTimeout(openMenu, 250);
  if (qs.indexOf('foods=1') >= 0) setTimeout(openFoods, 250);
  if (qs.indexOf('say=') >= 0) {
    var t = decodeURIComponent((qs.match(/say=([^&]+)/) || [])[1] || '');
    if (t) setTimeout(function () { say(t, { ms: 60000, action: 'food' }); }, 250);
  }

  window.PetUI = {
    applyState: applyState,
    say: say,
    openMenu: openMenu,
    openFoods: openFoods
  };
})();
</script>
</body>
</html>
