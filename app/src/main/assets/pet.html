<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  body.preview { background: radial-gradient(circle at 50% 30%, #f5efe6, #e6dccd); }

  #stage {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  #bubble {
    position: absolute;
    top: 4px; left: 50%;
    transform: translateX(-50%) scale(.8);
    background: #ffffff;
    color: #6b4f3a;
    border: 2px solid #e7d9c9;
    border-radius: 12px;
    padding: 5px 11px;
    font-size: 13px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 150px;
    text-align: center;
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    z-index: 10;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid #ffffff;
  }

  #pet { width: 100%; max-width: 300px; height: auto; }

  /* 呼吸 */
  .breathe {
    animation: breathe 3.4s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 100%;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-2px) scale(1.012); }
  }

  /* 耳朵抖 */
  .ear { transform-box: view-box; }
  .earL { transform-origin: 84px 54px; animation: earTwitch 5.0s ease-in-out infinite; }
  .earR { transform-origin: 116px 54px; animation: earTwitch 5.7s ease-in-out infinite 1.2s; }
  @keyframes earTwitch {
    0%, 86%, 100% { transform: rotate(0deg); }
    88% { transform: rotate(-12deg); }
    90% { transform: rotate(6deg); }
    92% { transform: rotate(-8deg); }
    94% { transform: rotate(4deg); }
    96% { transform: rotate(0deg); }
  }

  /* 尾巴摇 */
  .tail {
    transform-box: view-box; transform-origin: 116px 146px;
    animation: tailWag 2.1s ease-in-out infinite;
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(-8deg); }
    70% { transform: rotate(8deg); }
  }

  /* 眼珠子：外层 g 定位，内层 g 动画 */
  .orb { transform-box: fill-box; transform-origin: center; }
  .orb1 { animation: orbFloat1 3.6s ease-in-out infinite; }
  .orb2 { animation: orbFloat2 4.4s ease-in-out infinite .6s; }
  .orb3 { animation: orbFloat3 4.0s ease-in-out infinite 1.3s; }
  @keyframes orbFloat1 {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50%     { transform: translate(4px,-6px) rotate(11deg); }
  }
  @keyframes orbFloat2 {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50%     { transform: translate(-5px,-7px) rotate(-13deg); }
  }
  @keyframes orbFloat3 {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    50%     { transform: translate(3px,5px) rotate(9deg); }
  }
  .pupilGrp { transform-box: fill-box; transform-origin: center; }
  .orb1 .pupilGrp { animation: pupilDrift 2.8s ease-in-out infinite; }
  .orb2 .pupilGrp { animation: pupilDrift 3.4s ease-in-out infinite 1s; }
  .orb3 .pupilGrp { animation: pupilDrift 3.1s ease-in-out infinite .4s; }
  @keyframes pupilDrift {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(1px,-.6px); }
    75% { transform: translate(-1.2px,.6px); }
  }

  .sclera, .pupil, .glint, .mouth { transition: all .16s ease; }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>

  <svg id="pet" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="orbGrad" cx="40%" cy="34%" r="66%">
        <stop offset="0%" stop-color="#6a2f42"/>
        <stop offset="58%" stop-color="#3d1726"/>
        <stop offset="100%" stop-color="#18070f"/>
      </radialGradient>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.36"/>
        <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 坐姿黑猫 -->
    <g class="breathe">
      <!-- 卷尾（根部埋进身体） -->
      <path class="tail" d="M116 146 C 142 142, 158 154, 156 168 C 154 181, 139 184, 132 175"
            fill="none" stroke="#1e1e26" stroke-width="13" stroke-linecap="round"/>

      <!-- 正常猫耳（宽三角、微外倾） -->
      <g class="ear earL">
        <path d="M72 58 C 69 47, 67 36, 68 27 C 68.5 23, 72.5 23, 74 27 C 80 35, 88 44, 95 50 Z" fill="#1e1e26"/>
        <path d="M75 49 C 73 41, 72 33, 73 28 C 73.5 25.5, 76 25.5, 77.5 28 C 81.5 35, 86 42, 91 46 Z" fill="#3a2442" opacity=".9"/>
      </g>
      <g class="ear earR">
        <path d="M128 58 C 131 47, 133 36, 132 27 C 131.5 23, 127.5 23, 126 27 C 120 35, 112 44, 105 50 Z" fill="#1e1e26"/>
        <path d="M125 49 C 127 41, 128 33, 127 28 C 126.5 25.5, 124 25.5, 122.5 28 C 118.5 35, 114 42, 109 46 Z" fill="#3a2442" opacity=".9"/>
      </g>

      <!-- 身体（坐姿收腰） -->
      <path d="M100 90
               C 113 90, 121 100, 122 117
               C 123 138, 129 152, 128 162
               C 127 172, 115 176, 100 176
               C 85 176, 73 172, 72 162
               C 71 152, 77 138, 78 117
               C 79 100, 87 90, 100 90 Z" fill="#1e1e26"/>

      <!-- 头 -->
      <path d="M100 40
               C 118 40, 131 52, 131 70
               C 131 86, 121 96, 107 99
               C 103 100, 97 100, 93 99
               C 79 96, 69 86, 69 70
               C 69 52, 82 40, 100 40 Z" fill="#1e1e26"/>

      <!-- 眼睛（扁平卡通大眼：暖白眼白 + 琥珀瞳 + 单高光） -->
      <g id="eyeL" transform="translate(84,74)">
        <ellipse class="sclera" rx="8.5" ry="11" fill="#f7f0e4"/>
        <ellipse class="pupil" cx="0" cy="1" rx="4" ry="5.5" fill="#d08c2e"/>
        <circle class="glint" cx="-2.5" cy="-3.5" r="2.4" fill="#ffffff"/>
      </g>
      <g id="eyeR" transform="translate(116,74)">
        <ellipse class="sclera" rx="8.5" ry="11" fill="#f7f0e4"/>
        <ellipse class="pupil" cx="0" cy="1" rx="4" ry="5.5" fill="#d08c2e"/>
        <circle class="glint" cx="-2.5" cy="-3.5" r="2.4" fill="#ffffff"/>
      </g>

      <!-- 猫嘴（扁宽 w） -->
      <path class="mouth" id="mouthCat" d="M90 90 Q95 94.5 100 90 Q105 94.5 110 90" fill="none" stroke="#e0a14f" stroke-width="1.8" stroke-linecap="round"/>
      <!-- 张嘴笑 -->
      <g class="mouth" id="mouthOpen" opacity="0">
        <path d="M93 89 Q100 101 107 89 Z" fill="#200608" stroke="#e0a14f" stroke-width="1.2"/>
        <path d="M96 92 Q100 97 104 92 Z" fill="#c0505a"/>
      </g>

      <!-- 前爪（并拢在身前） -->
      <ellipse cx="91" cy="164" rx="10" ry="8" fill="#14141b"/>
      <ellipse cx="109" cy="164" rx="10" ry="8" fill="#14141b"/>
    </g>

    <!-- 飘着的眼珠子（放大版） -->
    <g transform="translate(30,46)">
      <g class="orb orb1">
        <circle cx="0" cy="0" r="20" fill="url(#glowGrad)"/>
        <circle cx="0" cy="0" r="10" fill="url(#orbGrad)"/>
        <g class="pupilGrp">
          <circle cx="0" cy="0" r="4.2" fill="#0a0a0e"/>
          <circle cx="-1.4" cy="-1.4" r="1.7" fill="#ff9aa8" opacity=".9"/>
        </g>
      </g>
    </g>
    <g transform="translate(171,48)">
      <g class="orb orb2">
        <circle cx="0" cy="0" r="18" fill="url(#glowGrad)"/>
        <circle cx="0" cy="0" r="9" fill="url(#orbGrad)"/>
        <g class="pupilGrp">
          <circle cx="0" cy="0" r="3.8" fill="#0a0a0e"/>
          <circle cx="-1.3" cy="-1.3" r="1.5" fill="#ff9aa8" opacity=".9"/>
        </g>
      </g>
    </g>
    <g transform="translate(29,146)">
      <g class="orb orb3">
        <circle cx="0" cy="0" r="17" fill="url(#glowGrad)"/>
        <circle cx="0" cy="0" r="8.5" fill="url(#orbGrad)"/>
        <g class="pupilGrp">
          <circle cx="0" cy="0" r="3.6" fill="#0a0a0e"/>
          <circle cx="-1.2" cy="-1.2" r="1.4" fill="#ff9aa8" opacity=".9"/>
        </g>
      </g>
    </g>
  </svg>
</div>

<script>
  var bubble    = document.getElementById('bubble');
  var eyeL      = document.getElementById('eyeL');
  var eyeR      = document.getElementById('eyeR');
  var mouthCat  = document.getElementById('mouthCat');
  var mouthOpen = document.getElementById('mouthOpen');

  var current = 'normal';

  if (location.protocol !== 'file:') {
    document.body.classList.add('preview');
  }

  var phrases = {
    tap:    ["嗯？", "在的。", "怎么啦？", "戳我干嘛~", "陛下？"],
    double: ["最喜欢你啦！", "抱抱！", "嘿嘿，看到你了"],
    long:   ["……别闹", "（脸红）", "会一直陪着你"],
    idle:   ["今天也要好好的", "我在呢", "想你了", "要记得喝水"]
  };
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  function say(text, ms) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(say.timer);
    say.timer = setTimeout(function(){ bubble.classList.remove('show'); }, ms || 1800);
  }

  function setEyes(mode) {
    var scleraRy = mode === 'normal' ? 11 : (mode === 'happy' ? 4.5 : 3);
    var innerOp  = mode === 'normal' ? 1 : 0;
    [eyeL, eyeR].forEach(function (e) {
      e.querySelector('.sclera').setAttribute('ry', scleraRy);
      e.querySelector('.pupil').setAttribute('opacity', innerOp);
      e.querySelector('.glint').setAttribute('opacity', innerOp);
    });
  }

  function setExpression(mode) {
    current = mode;
    setEyes(mode);
    mouthCat.setAttribute('opacity', mode === 'happy' ? 0 : 1);
    mouthOpen.setAttribute('opacity', mode === 'happy' ? 1 : 0);
  }

  function blink() {
    if (current !== 'normal') return;
    [eyeL, eyeR].forEach(function (e) {
      e.querySelector('.sclera').setAttribute('ry', 1);
      e.querySelector('.pupil').setAttribute('opacity', 0);
      e.querySelector('.glint').setAttribute('opacity', 0);
    });
    setTimeout(function () { if (current === 'normal') setEyes('normal'); }, 140);
  }

  var relaxTimer = null;
  function react(kind) {
    if (kind === 'shy') { setExpression('shy'); say(pick(phrases.long)); }
    else { setExpression('happy'); say(kind === 'double' ? pick(phrases.double) : pick(phrases.tap)); }
    clearTimeout(relaxTimer);
    relaxTimer = setTimeout(function(){ setExpression('normal'); }, 2600);
  }
  window.petEngine = {
    onTap:       function(){ react('tap'); },
    onDoubleTap: function(){ react('double'); },
    onLongPress: function(){ react('shy'); }
  };

  setInterval(function () { if (Math.random() < 0.5) blink(); }, 3200);

  setInterval(function () {
    if (current === 'normal' && !bubble.classList.contains('show')) say(pick(phrases.idle), 2200);
  }, 26000);
</script>
</body>
</html>
